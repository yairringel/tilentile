<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tile n Tile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #fff;
            color: #333;
        }

        header {
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 16px;
        }

        header {
            position: relative;
        }

        .lang-toggle {
            position: absolute;
            top: 16px;
            right: 16px;
            display: flex;
            border: 1px solid #ccc;
            border-radius: 999px;
            overflow: hidden;
            font-size: 14px;
        }

        .lang-toggle button {
            font: inherit;
            border: none;
            background: #fff;
            color: #555;
            padding: 6px 12px;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .lang-toggle button.selected {
            background: #333;
            color: #fff;
        }

        header img {
            max-width: 100%;
            max-height: 80px;
        }

        .scene {
            position: relative;
        }

        .bg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Overlay uses BG.png pixel coordinates, so areas stay aligned at any size */
        .scene svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .area {
            fill: transparent;
            stroke: transparent;
            stroke-width: 2;
            stroke-linejoin: round;
            cursor: pointer;
            transition: stroke 0.2s ease, fill 0.2s ease;
        }

        .area:hover,
        .area.active {
            fill: rgba(255, 220, 0, 0.35);
            stroke: #8fd3ff;
            filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.7));
        }

        .area-label {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 1px;
            fill: #fff;
            stroke: rgba(0, 0, 0, 0.6);
            stroke-width: 3px;
            paint-order: stroke;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .area:hover + .area-label,
        .area.active + .area-label {
            opacity: 1;
        }

        footer {
            background: #fff;
            text-align: center;
            padding: 24px 16px;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <header>
        <img src="text.png" alt="Tile n Tile">
        <div class="lang-toggle" role="group" aria-label="Language">
            <button type="button" data-lang="en">EN</button>
            <button type="button" data-lang="he">עב</button>
        </div>
    </header>

    <div class="scene">
        <img class="bg" src="BG.png" alt="">
        <svg viewBox="0 0 1448 1086">
            <polygon class="area" data-name="blue-plant-pot"
                points="1077,198 1071,200 1059,215 1028,222 1021,234 1022,245 1015,250 1016,256 1020,257 1016,280 1027,289 1026,371 1029,375 1105,382 1131,371 1133,300 1143,299 1146,303 1153,301 1153,283 1157,279 1149,279 1146,276 1145,265 1154,260 1155,252 1148,245 1141,229 1124,224 1106,205">
            </polygon>
            <text class="area-label" x="1079" y="408" text-anchor="middle" data-i18n="floorTilePots">Floor tile pots</text>
            <polygon class="area" data-name="peacock-plant-pot"
                points="1313,83 1310,89 1283,88 1290,96 1289,105 1253,102 1256,118 1222,137 1240,142 1240,151 1235,162 1243,163 1243,171 1236,178 1231,191 1249,189 1249,206 1237,207 1232,211 1231,443 1239,449 1275,451 1352,462 1377,449 1387,439 1387,238 1382,225 1383,207 1365,205 1364,190 1373,189 1381,194 1387,183 1387,179 1381,174 1381,165 1395,166 1392,155 1384,148 1384,140 1388,139 1385,126 1393,125 1394,122 1371,111 1371,103 1381,92 1350,92 1343,84 1340,88 1330,88">
            </polygon>
            <text class="area-label" x="1309" y="488" text-anchor="middle" data-i18n="customDesigns">Custom designs</text>
            <polygon class="area" data-name="herb-pots"
                points="418,179 412,174 407,163 390,160 385,150 368,148 357,161 356,171 351,178 339,177 327,167 313,167 307,163 300,170 286,169 286,173 278,179 273,189 264,188 264,177 258,173 254,177 253,186 233,181 224,191 216,194 207,208 198,210 194,219 201,223 201,230 208,231 208,278 228,288 415,280 418,276 418,228 415,222 416,207 420,201">
            </polygon>
            <text class="area-label" x="313" y="314" text-anchor="middle" data-i18n="herbPots">Herb pots</text>
            <ellipse class="area" data-name="woman-mosaic"
                cx="756" cy="640" rx="329" ry="154" transform="rotate(4.5 756 640)">
            </ellipse>
            <text class="area-label" x="756" y="822" text-anchor="middle" data-i18n="customMosaics">Custom mosaics</text>
        </svg>
    </div>

    <footer data-i18n="contact">Yair 0507727047</footer>
    <script>
        // Language toggle (English / Hebrew)
        (function () {
            const texts = {
                en: {
                    floorTilePots: 'Floor tile pots',
                    customDesigns: 'Custom designs',
                    herbPots: 'Herb pots',
                    customMosaics: 'Custom mosaics',
                    contact: 'Yair 0507727047'
                },
                he: {
                    floorTilePots: 'עציצים מאריחי רצפה',
                    customDesigns: 'עיצובים בהתאמה אישית',
                    herbPots: 'עציצי תבלינים',
                    customMosaics: 'פסיפסים בהתאמה אישית',
                    contact: 'יאיר 0507727047'
                }
            };
            const buttons = document.querySelectorAll('.lang-toggle button');

            function setLang(lang) {
                document.documentElement.lang = lang;
                document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    el.textContent = texts[lang][el.dataset.i18n];
                });
                buttons.forEach(b => b.classList.toggle('selected', b.dataset.lang === lang));
                try { localStorage.setItem('lang', lang); } catch (e) {}
            }

            buttons.forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

            let saved = 'en';
            try { saved = localStorage.getItem('lang') || 'en'; } catch (e) {}
            setLang(texts[saved] ? saved : 'en');
        })();

        // Highlight each area in turn (2s each) while the mouse is not over any area
        (function () {
            const areas = document.querySelectorAll('.scene .area');
            let index = -1;
            let timer = null;

            function showNext() {
                areas.forEach(a => a.classList.remove('active'));
                index = (index + 1) % areas.length;
                areas[index].classList.add('active');
            }

            function start() {
                if (timer) return;
                showNext();
                timer = setInterval(showNext, 2000);
            }

            function stop() {
                clearInterval(timer);
                timer = null;
                areas.forEach(a => a.classList.remove('active'));
            }

            areas.forEach(a => {
                a.addEventListener('mouseenter', stop);
                a.addEventListener('mouseleave', start);
            });

            start();
        })();
    </script>
</body>
</html>
